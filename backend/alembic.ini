[alembic]
script_location = alembic
prepend_sys_path = .
# The database URL comes from HT_DATABASE_URL (see alembic/env.py); never put credentials in this file.

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
