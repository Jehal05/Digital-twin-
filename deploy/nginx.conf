server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;                      # lab reports are limited to 5 MB by the API
  include /etc/nginx/healthtwin-security-headers.conf;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }
  location = /healthz { proxy_pass http://api:8000; }

  location /assets/ { include /etc/nginx/healthtwin-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location = /sw.js { include /etc/nginx/healthtwin-security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /index.html { include /etc/nginx/healthtwin-security-headers.conf; add_header Cache-Control "no-cache" always; }
  location / {                                  # single-page app: unknown paths (including /shared/<token>) load the app
    include /etc/nginx/healthtwin-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
